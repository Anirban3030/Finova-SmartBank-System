spring.application.name=smartbank
server.port=${PORT:8081}
spring.thymeleaf.cache=false

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartbank}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.admin.email=${ADMIN_EMAIL:adminsmartbank@gmail.com}
app.admin.password=${ADMIN_PASSWORD:change-this-development-password}

spring.ai.google.genai.api-key=${GOOGLE_AI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.8-flash}

spring.ai.google.genai.embedding.api-key=${GOOGLE_AI_API_KEY:}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001

logging.level.org.springframework.ai.vectorstore.SimpleVectorStore=WARN
app.rag.store-dir=${user.home}/.smartbank/rag
