<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Overview · SmartBank</title><link rel="stylesheet" href="/css/app.css"></head>
<body data-page="dashboard"><div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="page-shell"><div class="page-header"><div><p class="eyebrow">Personal banking</p><h1>Good to see you, <span id="welcome-name">there</span>.</h1><p class="muted">Here’s your financial snapshot.</p></div><a class="button" href="/customer/accounts">Manage accounts <span>→</span></a></div>
    <section class="metric-grid"><div class="metric-card accent"><span class="metric-label">Total balance</span><strong id="total-balance">₹0.00</strong><span class="metric-hint">Across your accounts</span></div>
        <div class="metric-card"><span class="metric-label">Your accounts</span><strong id="account-count">—</strong><span class="metric-hint">All account types</span></div>
        <div class="metric-card"><span class="metric-label">Active accounts</span><strong id="active-account">—</strong><span class="metric-hint">Ready to use</span></div></section>
    <section class="section-heading"><div><p class="eyebrow">Activity</p><h2>Recent transactions</h2></div><a class="text-link" href="/customer/transactions">View all →</a></section>
    <div class="table-card"><table><thead><tr><th>Type</th><th>Reference</th><th>Amount</th><th>Date</th><th>Status</th></tr></thead><tbody id="recent-transactions"><tr><td colspan="5" class="loading">Loading activity…</td></tr></tbody></table></div>
</main><div id="toast-host" class="toast-host"></div><script src="/js/common.js"></script></body></html>
