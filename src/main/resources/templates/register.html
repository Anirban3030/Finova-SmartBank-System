<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account · SmartBank</title><link rel="stylesheet" href="/css/app.css"></head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-intro"><a class="brand light" href="/login"><span class="brand-mark">S</span><span>SmartBank</span></a>
        <div><p class="eyebrow">Start confidently</p><h1>Banking that<br><em>keeps up.</em></h1><p class="auth-copy">Open your SmartBank profile in a few simple steps.</p></div>
        <p class="muted light-text">Your details stay protected</p></section>
    <section class="auth-card"><p class="eyebrow">Get started</p><h2>Create your account</h2><p class="muted">Join SmartBank today. You can open an account after signing in.</p>
        <form id="register-form" class="stack-form">
            <label>Full name<input name="name" type="text" maxlength="100" autocomplete="name" placeholder="Your name" required></label>
            <label>Email<input name="email" type="email" maxlength="150" autocomplete="email" placeholder="you@example.com" required></label>
            <label>Phone number<input name="phone" type="tel" pattern="[0-9]{10,15}" maxlength="15" autocomplete="tel" placeholder="10–15 digits" required></label>
            <label>Password<input name="password" type="password" minlength="8" maxlength="64" autocomplete="new-password" placeholder="At least 8 characters and one number" required></label>
            <button class="button full" type="submit">Create account <span>→</span></button>
        </form><p class="auth-switch">Already registered? <a href="/login">Sign in</a></p>
    </section>
</main><div id="toast-host" class="toast-host"></div><script src="/js/common.js"></script>
</body></html>
